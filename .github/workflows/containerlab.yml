name: Containerlab Deployment

on:
  workflow_dispatch:  # allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5

      - name: Checkout vyos-ansible-smoketests repository
        uses: actions/checkout@v5
        with:
          repository: sever-sever/vyos-ansible-smoketests
          path: vyos-ansible-smoketests

      - name: Install Containerlab
        run: |
          curl -sSL https://get.containerlab.dev | sudo bash

      #- name: Install paramiko
        #run: |
        #  # sudo pip install paramiko --break-system-packages
        #  pip3 install paramiko

      - name: Install Ansible
        working-directory: vyos-ansible-smoketests
        run: |
          #sudo apt-get update
          #udo apt-get install -y --no-install-recommends ansible
          #sudo pip3 install ansible paramiko --break-system-packages
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv
          python3 -m pip install --upgrade pip
          python3 -m pip install --user ansible ansible-pylibssh

      - name: Install VyOS Ansible Collection
        run: |
          ansible-galaxy collection install git+https://github.com/vyos/vyos.vyos.git,main

      - name: Deploy Containerlab topology
        run: |
          sudo clab deploy -t containerlab/vyos.clab.yml

      - name: Show deployed nodes
        run: |
          sudo clab inspect -t containerlab/vyos.clab.yml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false

      - name: Run Ansible Playbook (Smoke Tests)
        working-directory: vyos-ansible-smoketests
        run: |
          ansible --version
          ansible-playbook -i hosts main.yml

      - name: Destroy Containerlab topology
        run: |
          sudo clab destroy -t containerlab/vyos.clab.yml
